
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
</head>
<style>
    .gray{
        background-color: lightgray;
        width: 350px;
        height: 200px;
        position: relative;
        align-items: center;
    }
    .green{
        color: white;
        background-color: green;
        text-align:center;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        position:absolute;
        top: 00px;
        right: 00px;
    }
</style>
<body>
    <div class="gray">
    <div class="green">3</div>
</div>
</body>
</html>

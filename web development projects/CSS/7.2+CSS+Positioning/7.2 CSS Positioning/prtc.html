<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice positioning</title>
    <style>
        .white{
            background-color: whitesmoke;
            width: 400px;
            height: 250px;
            margin: 100px auto;
            position: relative;
        }
        .red{
            width: 80px;
            height: 40px;
            color: white;
            background-color: red;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            position: absolute;
            top: -20px;
            left: -20px;
        }
    </style>
</head>
<body>
    <div>
        <div class="white">
            <div class="red">
               SALE
            </div>
        </div>
    </div>
</body>
</html>

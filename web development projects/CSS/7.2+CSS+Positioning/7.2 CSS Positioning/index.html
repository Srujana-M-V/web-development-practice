<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
  .blue-box {
      background-color: blue;
      width: 500px;
      height: 300px;
      margin-top: 200px;
      margin-bottom: 200px;
      margin-left: 200px;
      margin-right: 200px;
      position: relative;
  }
  .red-circle{
    width: 200px;
    height: 200px;
    background-color: red;
    margin-left: 250px;
    margin-top: 150px;
    position: absolute;
    border-radius: 50%;
  }
  </style>
</head>
<body>
  <div class="blue-box">
    <div class="red-circle">
    </div>
  </div>

</body>

</html>

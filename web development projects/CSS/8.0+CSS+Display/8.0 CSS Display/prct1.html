<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DISPLAY</title>
    <style>
        .a{
            height: 500px;
            width: 500px;
            color: bisque;
            background-color: red;
            display: block;
        }
        .b{
           height: 300px;
            width: 300px;
            color: bisque;
            background-color: blue;
            display: block; 
        }
        .c{
            height: 100px;
            width: 100px;
            color: bisque;
            background-color: pink;
            display: block;
        }
        h2{
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="a">
        <h3>Red</h3>
        <div class="b"><h3>Blue</h3>
            <div class="c">Pink</div>
        </div>
        <h2>Green</h2>
    </div>
</body>
</html>

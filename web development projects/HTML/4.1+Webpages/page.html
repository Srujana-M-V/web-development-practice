<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #333;
            color: white;
            padding: 15px;
        }

        section {
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <section>
        <h2>Hello 👋</h2>
        <p>This is a simple HTML page.</p>
        <button onclick="showMessage()">Click Me</button>
    </section>

    <script>
        function showMessage() {
            alert("You clicked the button!");
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BOX MODEL</title>
    <style>
        .sun{
            width: 200px;
            padding: 20px;
            margin: 30px;
            border: 5px solid red;
            box-sizing: border-box;
            text-align: center;
        }
.son{
    width: 200px;
    padding: 50px;
    border: 10px solid green;
    box-sizing: border-box;
    text-align: center;
}
.soon{
    width: 300px;
    padding: 20px;
    border: 10px solid pink;
    margin: 10px;
    box-sizing: border-box;
    text-align: center;
}
    </style>
</head>
<body>
    <div class="sun">Box 1
    </div>
    <div class="son">Box 2</div>
    <div class="soon">Box 3</div>
</body>
</html>
